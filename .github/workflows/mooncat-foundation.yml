name: Moon Cat Foundation CI
on:
  push:
    branches: ['feature/mooncat-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: mooncat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: bash gradlew assembleProdDebug testProdDebugUnitTest --no-daemon
      - name: Verify APK privacy
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/prod/debug -name '*.apk' -print -quit)
          test -n "$apk"
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$analyzer"
          permissions=$("$analyzer" manifest permissions "$apk")
          printf '%s\n' "$permissions"
          if grep -Eq '^android[.]permission[.](INTERNET|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACCESS_BACKGROUND_LOCATION)$' <<< "$permissions"; then
            echo 'Forbidden permission detected'
            exit 1
          fi
          test "$("$analyzer" manifest application-id "$apk")" = 'app.mooncat.launcher.debug'
          test "$("$analyzer" manifest min-sdk "$apk")" = '28'
          "$analyzer" manifest print "$apk" | python3 -c '
          import sys
          from xml.etree import ElementTree

          manifest = ElementTree.parse(sys.stdin)
          application = manifest.find("application")
          android = "{http://schemas.android.com/apk/res/android}"
          if application is None or application.get(android + "allowBackup") != "false":
              sys.exit("Expected Android automatic backups to be disabled")
          '
      - uses: actions/upload-artifact@v4
        with:
          name: mooncat-debug
          path: app/build/outputs/apk/prod/debug/*.apk
          if-no-files-found: error
